<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Primary SEO -->
    <title>ComplaintHub — Official Civic Grievance Redressal Portal</title>
    <meta name="description" content="Official civic grievance redressal portal to report, track, and resolve community municipal issues transparently." />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://complainthub.app" />
    <meta property="og:title" content="ComplaintHub — Civic Complaint Management Platform" />
    <meta property="og:description" content="Report, track, and resolve civic issues in your community. Submit complaints about potholes, garbage, streetlights, and more." />
    <meta property="og:image" content="https://complainthub.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ComplaintHub — Civic Complaint Management Platform" />
    <meta name="twitter:description" content="Report, track, and resolve civic issues in your community with ComplaintHub." />
    <meta name="twitter:image" content="https://complainthub.app/og-image.png" />

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        var theme = localStorage.getItem('ch_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
